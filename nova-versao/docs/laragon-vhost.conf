# ===========================================
# Virtual Host — Laragon (instalado em E:\laragon\)
#
# Copie este conteúdo para:
# E:\laragon\etc\apache2\sites-enabled\auto.concessionaria-bem.conf
#
# Depois: clique direito no Laragon (bandeja) → Apache → Reload
# ===========================================

<VirtualHost *:80>
    ServerName concessionaria-bem.test
    DocumentRoot "E:/DEV/Projeto Concessionaria Inteligente/nova-versao/public"

    <Directory "E:/DEV/Projeto Concessionaria Inteligente/nova-versao/public">
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog "E:/DEV/Projeto Concessionaria Inteligente/nova-versao/storage/logs/apache-error.log"
    CustomLog "E:/DEV/Projeto Concessionaria Inteligente/nova-versao/storage/logs/apache-access.log" combined
</VirtualHost>
