; ===========================================
; public/.user.ini — PHP para produção Locaweb
; Aplicado automaticamente pelo PHP-FPM/CGI
; Não renomear — precisa ser exatamente .user.ini
; ===========================================

; Erros — nunca exibir em produção
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Uploads
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10

; Execução
max_execution_time = 60
max_input_time = 60
memory_limit = 128M

; Sessão — configurações base (cookie_secure e samesite são definidos
; programaticamente em session_set_cookie_params() via APP_ENV)
session.cookie_httponly = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

; Segurança geral
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
